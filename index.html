/* ==========================================================================
   Rutina de Alejandro y Miryam — estilos
   Estética japonesa sobria: papel (kinari), tinta (sumi), un color de acento
   por persona (elegible) y el rojo bermellón (shu) de los sellos.
   ========================================================================== */
:root {
  --bg: #F2EEE6; --bg2: #EAE4D9; --surface: #FBF9F5; --surface2: #F5F1E9; --ink: #1F1D1A; --ink2: #3A3732; --muted: #6E685E;
  --line: rgba(31, 29, 26, .10); --line2: rgba(31, 29, 26, .18);
  --a-l: #2F5374; --a-d: #8FB1D6;
  --a: var(--a-l); --a-soft: var(--a-soft-l, rgba(47, 83, 116, .11)); --a-glow: var(--a-glow-l, rgba(47, 83, 116, .22)); --on-a: #FFFFFF;
  --shu: #B5432F; --shu-soft: rgba(181, 67, 47, .10); --gold: #8E6A2C; --gold-soft: rgba(142, 106, 44, .12);
  --ok: #5E7A3A; --ok-soft: rgba(94, 122, 58, .12); --no: #B5432F; --no-soft: rgba(181, 67, 47, .10);
  --shadow: 0 1px 0 rgba(60, 45, 25, .03), 0 6px 22px rgba(60, 45, 25, .06);
  --shadow2: 0 2px 6px rgba(60, 45, 25, .06), 0 18px 44px rgba(60, 45, 25, .10);
  --r: 16px; --r2: 12px; --r3: 10px;
  --fs: 18px;
  --display: "Fz Serif", "Hiragino Mincho ProN", "Yu Mincho", Georgia, "Times New Roman", serif;
  --body: "Fz Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  --tabh: 70px;
  --ease: cubic-bezier(.2, .7, .2, 1);
  color-scheme: light;
}
:root[data-text="2"] { --fs: 20.5px; }
:root[data-text="3"] { --fs: 23px; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --bg2: #1A1916; --surface: #1F1E1B; --surface2: #272521; --ink: #EEE8DC; --ink2: #D8D1C3; --muted: #A69E90;
    --line: rgba(238, 232, 220, .10); --line2: rgba(238, 232, 220, .18);
    --a: var(--a-d); --a-soft: var(--a-soft-d, rgba(143, 177, 214, .14)); --a-glow: var(--a-glow-d, rgba(143, 177, 214, .2)); --on-a: #141311;
    --shu: #E0876F; --shu-soft: rgba(224, 135, 111, .14); --gold: #D8B46A; --gold-soft: rgba(216, 180, 106, .14);
    --ok: #A9C47C; --ok-soft: rgba(169, 196, 124, .14); --no: #E0876F; --no-soft: rgba(224, 135, 111, .13);
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 26px rgba(0, 0, 0, .28); --shadow2: 0 4px 10px rgba(0, 0, 0, .35), 0 20px 50px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --bg2: #1A1916; --surface: #1F1E1B; --surface2: #272521; --ink: #EEE8DC; --ink2: #D8D1C3; --muted: #A69E90;
  --line: rgba(238, 232, 220, .10); --line2: rgba(238, 232, 220, .18);
  --a: var(--a-d); --a-soft: var(--a-soft-d, rgba(143, 177, 214, .14)); --a-glow: var(--a-glow-d, rgba(143, 177, 214, .2)); --on-a: #141311;
  --shu: #E0876F; --shu-soft: rgba(224, 135, 111, .14); --gold: #D8B46A; --gold-soft: rgba(216, 180, 106, .14);
  --ok: #A9C47C; --ok-soft: rgba(169, 196, 124, .14); --no: #E0876F; --no-soft: rgba(224, 135, 111, .13);
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 8px 26px rgba(0, 0, 0, .28); --shadow2: 0 4px 10px rgba(0, 0, 0, .35), 0 20px 50px rgba(0, 0, 0, .4);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: var(--fs); line-height: 1.55;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--a); outline-offset: 3px; border-radius: 8px; }
img { max-width: 100%; display: block; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .005em; text-wrap: balance; margin: 0; line-height: 1.2; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .84em; line-height: 1.5; }
.eyebrow { font-size: .7em; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--a); display: inline-flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 18px; height: 1.5px; background: currentColor; display: inline-block; }
.jp { font-family: var(--display); font-weight: 400; letter-spacing: .08em; white-space: nowrap; }

/* ---------- fondo con patrón tradicional ---------- */
.shell { min-height: 100vh; min-height: 100dvh; padding-bottom: calc(var(--tabh) + 20px + env(safe-area-inset-bottom, 0px)); position: relative; }
.shell::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 460px; pointer-events: none; z-index: 0;
  background-image: var(--pat, none); background-size: var(--pat-size, 40px 20px);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%); mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.55) 45%, transparent 100%); }
.shell::after { content: ""; position: fixed; right: -120px; top: -140px; width: 420px; height: 420px; border-radius: 50%; pointer-events: none; z-index: 0; background: radial-gradient(closest-side, var(--a-soft), transparent); }

/* ---------- estructura ---------- */
.wrap { position: relative; z-index: 1; max-width: 1120px; margin: 0 auto; padding-inline: 18px; }
.top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 8px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; border: 0; background: none; padding: 0; text-align: left; }
.brand .seal { flex: none; }
.brand b { display: block; font-family: var(--display); font-weight: 600; font-size: 1.14em; letter-spacing: .01em; line-height: 1.15; white-space: nowrap; }
.brand > span:last-child > span { display: block; font-size: .7em; color: var(--muted); letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand > span:last-child { min-width: 0; }
.seal { width: 40px; height: 40px; border-radius: 7px; background: var(--shu); color: var(--on-shu); display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 24px; line-height: 1; transform: rotate(-4deg); box-shadow: inset 0 0 0 2px rgba(251, 249, 244, .85), inset 0 0 0 4px var(--shu); }
.who-chip { display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px 4px 4px; box-shadow: var(--shadow); min-height: 48px; position: relative; overflow: hidden; }
.who-chip .av { width: 38px; height: 38px; border-radius: 50%; overflow: hidden; background: var(--a-soft); flex: none; }
.who-chip .av canvas { width: 100%; height: 100%; display: block; }
.who-chip small { display: block; font-size: .66em; color: var(--muted); line-height: 1; letter-spacing: .04em; }
.who-chip strong { display: block; font-size: .9em; line-height: 1.2; font-weight: 700; }

main.view { position: relative; z-index: 1; padding-block: 8px 24px; view-transition-name: main-view; }
.section { margin-block: 30px; }
.section > h2, .h2 { font-size: 1.4em; margin-bottom: 14px; display: flex; align-items: baseline; gap: 12px; }
.h2 .jp { font-size: .62em; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.pad { padding: 20px; }

/* entrada escalonada de los bloques de cada pantalla */
.stagger > * { animation: rise .55s var(--ease) both; }
.stagger > *:nth-child(2) { animation-delay: .04s; } .stagger > *:nth-child(3) { animation-delay: .08s; } .stagger > *:nth-child(4) { animation-delay: .12s; }
.stagger > *:nth-child(5) { animation-delay: .16s; } .stagger > *:nth-child(6) { animation-delay: .2s; } .stagger > *:nth-child(n+7) { animation-delay: .24s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
::view-transition-old(main-view) { animation: vt-out .22s ease both; }
::view-transition-new(main-view) { animation: vt-in .38s var(--ease) both; }
@keyframes vt-out { to { opacity: 0; transform: translateY(-6px); } }
@keyframes vt-in { from { opacity: 0; transform: translateY(10px); } }

/* ---------- barra de pestañas ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); background: color-mix(in srgb, var(--surface) 92%, transparent);
  border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  -webkit-backdrop-filter: saturate(1.3) blur(14px); backdrop-filter: saturate(1.3) blur(14px); }
.tabs button { position: relative; border: 0; background: transparent; border-radius: 14px; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: .72em; font-weight: 700; letter-spacing: .03em; overflow: hidden; transition: color .25s ease; }
.tabs button svg { width: 25px; height: 25px; transition: transform .35s var(--ease); }
.tabs button::before { content: ""; position: absolute; top: 3px; left: 50%; width: 22px; height: 2.5px; border-radius: 2px; background: var(--a); transform: translateX(-50%) scaleX(0); transition: transform .35s var(--ease); }
.tabs button[aria-current="page"] { color: var(--a); }
.tabs button[aria-current="page"]::before { transform: translateX(-50%) scaleX(1); }
.tabs button[aria-current="page"] svg { transform: translateY(-1px) scale(1.06); }
@media (min-width: 900px) {
  .tabs { position: sticky; top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); grid-template-columns: repeat(4, auto); justify-content: center; gap: 10px; padding: 8px; }
  .tabs button { flex-direction: row; gap: 8px; padding: 0 20px; min-height: 46px; font-size: .86em; }
  .tabs button::before { top: auto; bottom: 2px; }
  .tabs button svg { width: 21px; height: 21px; }
  .shell { padding-bottom: 40px; }
}

/* ---------- botones y efecto tinta ---------- */
.btn { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 22px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); font-weight: 700; color: var(--ink); text-decoration: none; letter-spacing: .01em; transition: transform .15s ease, box-shadow .25s ease, background .25s ease; }
.btn svg { width: 21px; height: 21px; flex: none; }
.btn:active { transform: scale(.975); }
.btn.primary { background: var(--a); border-color: transparent; color: var(--on-a); box-shadow: 0 8px 20px var(--a-glow); }
.btn.primary:hover { box-shadow: 0 10px 26px var(--a-glow); }
.btn.big { min-height: 62px; font-size: 1.06em; padding: 0 28px; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }
.btn.soft { background: var(--a-soft); border-color: transparent; color: var(--a); }
.btn.danger { color: var(--no); border-color: var(--no-soft); background: var(--no-soft); }
.btn:disabled { opacity: .45; }
.ink { position: absolute; border-radius: 50%; pointer-events: none; background: currentColor; opacity: .18; transform: scale(0); animation: inkdrop .6s ease-out forwards; }
@keyframes inkdrop { to { transform: scale(1); opacity: 0; } }
.linkbtn { border: 0; background: none; padding: 6px 4px; color: var(--a); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; min-height: 44px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* ---------- elegir persona ---------- */
.pick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 22px; }
.pick button { position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--surface); border-radius: 22px; padding: 18px 12px 20px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 250px; transition: transform .25s var(--ease), box-shadow .25s ease; }
.pick button:hover { transform: translateY(-3px); box-shadow: var(--shadow2); }
.pick .portrait { width: min(170px, 38vw); aspect-ratio: 1; border-radius: 50%; overflow: hidden; box-shadow: inset 0 0 0 1px var(--line); }
.pick .portrait canvas { width: 100%; height: 100%; display: block; }
.pick strong { font-family: var(--display); font-weight: 600; font-size: 1.5em; color: var(--pc); }
.pick span { color: var(--muted); font-size: .84em; }

/* ---------- inicio ---------- */
.hello { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; margin-top: 6px; }
.hello .portrait { width: 116px; height: 116px; border-radius: 50%; overflow: hidden; box-shadow: var(--shadow); background: var(--surface); border: 1px solid var(--line); }
.hello .portrait canvas { width: 100%; height: 100%; display: block; }
.hello h1 { font-size: clamp(1.7em, 5.5vw, 2.4em); }
.hello p { color: var(--muted); margin-top: 4px; }
.today { margin-top: 20px; padding: 22px; position: relative; overflow: hidden; }
.today > * { position: relative; z-index: 1; }
.today .kanji { position: absolute; z-index: 0; right: 8px; top: -26px; font-family: var(--display); font-size: 170px; line-height: 1; color: var(--a); opacity: .08; pointer-events: none; }
.today h2 { font-size: clamp(1.5em, 5vw, 2em); margin-top: 8px; }
.today .plan { display: flex; gap: 10px; margin: 16px -4px 18px; overflow-x: auto; padding: 4px 4px 6px; scrollbar-width: none; }
.today .plan::-webkit-scrollbar { display: none; }
.th { width: 76px; flex: none; text-align: center; font-size: .64em; color: var(--muted); line-height: 1.25; border: 0; background: none; padding: 0; transition: transform .2s var(--ease); }
.th:active { transform: scale(.96); }
.th img { width: 76px; height: 95px; border-radius: 10px; object-fit: cover; background: var(--surface2); border: 1px solid var(--line); margin-bottom: 6px; }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: .72em; color: var(--muted); font-weight: 700; }
.week .d i { width: 38px; height: 38px; border-radius: 50%; border: 1.5px dashed var(--line2); display: grid; place-items: center; font-style: normal; }
.week .d.done i { border: 0; background: none; }
.week .d.done i .stamp { width: 36px; height: 36px; font-size: 19px; }
.week .d.is-today b { color: var(--a); }
.week .d.is-today i { border-color: var(--a); border-style: solid; }
.stamp { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; background: var(--shu); color: var(--on-shu); font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1; transform: rotate(-8deg); box-shadow: inset 0 0 0 2px rgba(251, 249, 244, .8), inset 0 0 0 3.5px var(--shu); }
.stamp.sq { border-radius: 7px; }
.stamp.pop { animation: stampin .5s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes stampin { from { transform: rotate(-8deg) scale(1.9); opacity: 0; } 60% { opacity: 1; } to { transform: rotate(-8deg) scale(1); } }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat { padding: 16px 14px; }
.stat b { display: block; font-family: var(--display); font-size: 2em; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .76em; color: var(--muted); }
.proverb { padding: 20px 22px; position: relative; overflow: hidden; }
.proverb .k { font-family: var(--display); font-size: 1.5em; letter-spacing: .14em; color: var(--ink); }
.proverb .r { font-size: .74em; color: var(--muted); letter-spacing: .08em; margin-top: 2px; }
.proverb .t { font-family: var(--display); font-size: 1.05em; margin-top: 10px; color: var(--ink2); }
.proverb::after { content: ""; position: absolute; left: 0; top: 18px; bottom: 18px; width: 3px; background: var(--shu); border-radius: 2px; }
@media (min-width: 980px) {
  .homegrid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .homegrid .weeksec { margin-top: 8px; }
}
/* evolución del avatar */
.evo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; align-items: end; text-align: center; }
.evo .p { border-radius: 50%; overflow: hidden; aspect-ratio: 1; background: var(--surface2); border: 1px solid var(--line); }
.evo .p canvas { width: 100%; height: 100%; display: block; }
.evo .now .p { box-shadow: 0 0 0 3px var(--a); }
.evo small { display: block; font-size: .7em; color: var(--muted); margin-top: 6px; font-weight: 700; letter-spacing: .04em; }
.bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin-top: 14px; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--a); background: linear-gradient(90deg, var(--a), color-mix(in srgb, var(--a) 60%, var(--shu))); width: 0; transition: width 1s var(--ease); }

/* ---------- rutina ---------- */
.seg { display: flex; gap: 6px; overflow-x: auto; padding: 4px; margin: 6px -4px 16px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { position: relative; overflow: hidden; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-height: 46px; padding: 0 18px; font-weight: 700; color: var(--ink2); transition: background .25s ease, color .25s ease, border-color .25s ease; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.dayhead { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; position: relative; }
.dayhead h2, .dayhead h1 { font-size: 1.8em; }
.sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.dayhead .kanji { font-family: var(--display); font-size: 3.2em; line-height: 1; color: var(--a); opacity: .9; margin-right: 6px; }
.list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 720px) { .list { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1040px) { .list { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.exc { position: relative; overflow: hidden; display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; padding: 12px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); transition: transform .25s var(--ease), box-shadow .25s ease; }
.exc:hover { transform: translateY(-2px); box-shadow: var(--shadow2); }
.exc:active { transform: scale(.985); }
.exc .tn { width: 96px; height: 120px; border-radius: 10px; overflow: hidden; background: var(--surface2); position: relative; }
.exc .tn img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease); }
.exc:hover .tn img { transform: scale(1.04); }
.exc .n { position: absolute; left: 6px; top: 6px; width: 26px; height: 26px; border-radius: 6px; background: var(--surface); color: var(--ink); font-family: var(--display); font-weight: 600; font-size: .78em; display: grid; place-items: center; box-shadow: var(--shadow); }
.exc h3 { font-size: 1.1em; margin-bottom: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 11px; font-size: .72em; font-weight: 700; background: var(--a-soft); color: var(--a); }
.chip svg { width: 14px; height: 14px; flex: none; }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.neutral { background: transparent; color: var(--muted); border: 1px solid var(--line2); }
.exc .meta { margin-top: 8px; font-size: .78em; color: var(--muted); }
.note-claude { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-radius: var(--r2); background: var(--surface2); border: 1px dashed var(--line2); font-size: .86em; color: var(--ink2); margin-bottom: 16px; }
.note-claude svg { width: 22px; height: 22px; flex: none; color: var(--gold); margin-top: 2px; }

/* ---------- ficha de ejercicio ---------- */
/* barra «‹ Atrás»: siempre a mano, pegada arriba al bajar */
.backbar { position: sticky; top: 0; z-index: 25; margin: 0 -18px 4px; padding: 4px 12px; background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.backbar .bb { display: inline-flex; align-items: center; gap: 4px; min-height: 48px; min-width: 48px; padding: 0 10px 0 4px; border: 0; background: none; color: var(--a); font-weight: 700; font-size: 1em; border-radius: 12px; }
.backbar .bb svg { width: 26px; height: 26px; flex: none; transition: transform .2s ease; }
.backbar .bb span { max-width: 62vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.backbar .bb:hover svg { transform: translateX(-3px); }
@media (min-width: 900px) { .backbar { top: 62px; } }
.swipeback { position: fixed; left: -8px; z-index: 96; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--a); box-shadow: var(--shadow2); pointer-events: none; opacity: .75; transition: background .15s ease, color .15s ease, opacity .15s ease; }
.swipeback svg { width: 24px; height: 24px; }
.swipeback.go { background: var(--a); color: var(--bg); opacity: 1; }
.stagger.noanim > * { animation: none !important; }
main.view:focus, main.view h1:focus { outline: none; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--a); font-weight: 700; min-height: 44px; padding: 0; }
.back svg { width: 22px; height: 22px; transition: transform .2s ease; }
.back:hover svg { transform: translateX(-3px); }
.exhead { margin: 4px 0 18px; }
.exhead h1 { font-size: clamp(1.8em, 6vw, 2.6em); margin: 8px 0 10px; }
.exgrid > *, .s-grid > * { min-width: 0; }
.exgrid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; align-items: start; }
@media (min-width: 900px) { .exgrid { grid-template-columns: minmax(0, 440px) minmax(0, 1fr); } .exgrid .sticky { position: sticky; top: 74px; } }
.boxes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 600px) { .boxes.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.box { padding: 18px 18px 16px; }
.box h3 { font-family: var(--body); font-size: .72em; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--a); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.box h3 svg { width: 18px; height: 18px; }
.box.alert h3 { color: var(--no); }
.box.alert { border-color: var(--no-soft); }
.box ul { margin: 0; padding-left: 1.1em; }
.box li { margin: 5px 0; }
.box li::marker { color: var(--a); }
.box .src { font-size: .72em; color: var(--muted); margin-top: 10px; }
.alex { position: relative; padding: 20px 20px 18px 22px; border-left: 3px solid var(--shu); }
.alex h3 { color: var(--shu); }
.alex ul { list-style: none; padding: 0; display: grid; gap: 10px; }
.alex li { position: relative; padding-left: 26px; font-family: var(--display); font-size: 1.02em; line-height: 1.5; color: var(--ink2); }
.alex li::before { content: "「"; position: absolute; left: 0; top: -2px; color: var(--shu); font-family: var(--display); }
.alex .src { margin-top: 12px; }
.setup li { margin: 6px 0; }
.setup { border-left: 3px solid var(--a); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li button { position: relative; overflow: hidden; width: 100%; text-align: left; display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; border: 1px solid var(--line); background: var(--surface2); border-radius: 12px; padding: 10px 12px; min-height: 56px; transition: border-color .25s ease, background .25s ease; }
.steps li button:hover { border-color: var(--a); }
.steps li button.on { border-color: var(--a); background: var(--a-soft); }
.steps .k { width: 30px; height: 30px; border-radius: 8px; background: var(--a); color: var(--on-a); display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: .82em; }
.steps .go { color: var(--a); font-size: .72em; font-weight: 700; display: flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
.steps .go svg { width: 16px; height: 16px; }
.steps h4 { margin: 12px 0 2px; font-size: .7em; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.yesno { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.yesno .p { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.yesno .no, .yesno .si { border-radius: 12px; padding: 12px 14px; font-size: .9em; display: flex; gap: 10px; align-items: flex-start; }
.yesno .no { background: var(--no-soft); } .yesno .si { background: var(--ok-soft); }
.yesno svg { width: 20px; height: 20px; flex: none; margin-top: 2px; }
.yesno .no svg { color: var(--no); } .yesno .si svg { color: var(--ok); }
@media (max-width: 480px) { .yesno .p { grid-template-columns: minmax(0, 1fr); } }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: .92em; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 700; }
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.field label { font-size: .78em; font-weight: 700; color: var(--muted); }
.field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line2); background: var(--surface2); border-radius: 10px; padding: 12px 14px; min-height: 50px; transition: border-color .2s ease, box-shadow .2s ease; }
.field input:focus, .field textarea:focus { outline: none; border-color: var(--a); box-shadow: 0 0 0 3px var(--a-soft); }
.field textarea { min-height: 96px; resize: vertical; }
.saved { color: var(--ok); font-size: .8em; font-weight: 700; min-height: 1.3em; }

/* ---------- reproductor ---------- */
.player { border-radius: var(--r); overflow: hidden; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow2); }
.pl-stage { position: relative; background: var(--stage-bg, #EFEAE1); }
.pl-stage canvas { width: 100%; aspect-ratio: 4 / 5; display: block; max-width: 100%; touch-action: manipulation; }
.pl-big { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); width: 84px; height: 84px; border-radius: 50%; border: 0; background: var(--a); color: var(--on-a); box-shadow: 0 10px 30px rgba(40, 30, 15, .28); display: grid; place-items: center; transition: transform .25s var(--ease), opacity .2s ease; }
.pl-big::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 1.5px solid var(--a); opacity: .5; animation: halo 2.4s ease-out infinite; }
@keyframes halo { from { transform: scale(.9); opacity: .6; } to { transform: scale(1.35); opacity: 0; } }
.pl-big:hover { transform: translate(-50%, -50%) scale(1.06); }
.pl-big svg { width: 36px; height: 36px; margin-left: 5px; }
.pl-big[hidden] { display: none !important; }
.pl-bar { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 10px 12px 4px; }
.pl-btn { position: relative; overflow: hidden; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--a-soft); color: var(--a); display: grid; place-items: center; }
.pl-btn svg { width: 23px; height: 23px; }
.pl-track { position: relative; height: 44px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.pl-track .rail { position: absolute; left: 0; right: 0; height: 5px; border-radius: 99px; background: var(--line2); overflow: hidden; }
.pl-track .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--a); width: 0; }
.pl-track .tick { position: absolute; top: 50%; width: 2px; height: 11px; margin-top: -5.5px; background: var(--surface); }
.pl-track .knob { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--a); border: 3px solid var(--surface); box-shadow: var(--shadow); margin-left: -9px; left: 0; }
.pl-time { font-size: .72em; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
.pl-opts { display: flex; gap: 8px; padding: 4px 12px 12px; flex-wrap: wrap; }
.pl-opt { position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--surface2); border-radius: 999px; min-height: 40px; padding: 0 14px; font-size: .76em; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); transition: background .2s ease, color .2s ease; }
.pl-opt svg { width: 18px; height: 18px; }
.pl-opt[aria-pressed="true"] { background: var(--a-soft); border-color: transparent; color: var(--a); }
.pl-chaps { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 12px; scrollbar-width: none; }
.pl-chaps::-webkit-scrollbar { display: none; }
.pl-chaps button { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 999px; min-height: 36px; padding: 0 12px; font-size: .7em; font-weight: 700; color: var(--muted); transition: background .2s ease, color .2s ease; }
.pl-chaps button.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }

/* ---------- sesión ---------- */
/* el entreno es una pantalla normal de la página (nada de capa fija con su propio scroll:
   en el iPhone, dentro de la app de Claude, esas capas dejaban de responder a los toques) */
.session { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; background: var(--bg); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
body.inscreen .shell { display: none; }
.session.opening { animation: sheetup .45s var(--ease) both; }
.session.closing { animation: sheetdown .35s ease both; }
@keyframes sheetup { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes sheetdown { to { transform: translateY(30px); opacity: 0; } }
.session .wrap { max-width: 860px; padding-block: 12px 40px; }
.s-top { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; margin-bottom: 12px; }
.s-prog { height: 6px; border-radius: 99px; background: var(--line2); overflow: hidden; }
.s-prog i { display: block; height: 100%; background: var(--a); border-radius: 99px; transition: width .6s var(--ease); }
.s-x { position: relative; overflow: hidden; width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; color: var(--ink2); }
.s-x svg { width: 22px; height: 22px; }
.s-step { font-size: .76em; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.s-title { font-size: clamp(1.6em, 6vw, 2.3em); margin: 8px 0 4px; }
.s-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (max-width: 759px) { .session .player .pl-stage canvas { max-height: 40vh; width: auto; margin: 0 auto; } .session .pl-stage { display: flex; justify-content: center; } }
@media (min-width: 760px) { .s-grid.twocol { grid-template-columns: minmax(0, 400px) minmax(0, 1fr); align-items: start; } }
.sets { display: flex; gap: 8px; margin: 10px 0 14px; }
.sets i { flex: 1; height: 8px; border-radius: 99px; background: var(--line2); position: relative; }
.sets i.done { background: var(--a); } .sets i.cur { background: var(--a-glow); box-shadow: inset 0 0 0 2px var(--a); }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; gap: 8px; margin-bottom: 14px; }
.stepper button { position: relative; overflow: hidden; height: 64px; border-radius: 16px; border: 1px solid var(--line2); background: var(--surface); display: grid; place-items: center; color: var(--ink); transition: transform .12s ease; }
.stepper button:active { transform: scale(.94); }
.stepper button svg { width: 26px; height: 26px; }
.stepper .val { text-align: center; }
.stepper .val b { display: block; font-family: var(--display); font-size: 2.3em; line-height: 1; font-variant-numeric: tabular-nums; }
.stepper .val b.bump { animation: bump .3s var(--ease); }
@keyframes bump { 40% { transform: scale(1.18); color: var(--a); } }
.stepper .val span { font-size: .74em; color: var(--muted); font-weight: 700; }
.unit { display: inline-flex; border: 1px solid var(--line2); border-radius: 999px; overflow: hidden; margin: -4px 0 14px; }
.unit button { border: 0; background: transparent; min-height: 38px; padding: 0 14px; font-size: .76em; font-weight: 700; color: var(--muted); }
.unit button[aria-pressed="true"] { background: var(--a); color: var(--on-a); }
.rest { text-align: center; padding: 18px 0; }
.ring { width: min(280px, 70vw); aspect-ratio: 1; margin: 12px auto 18px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(3em, 16vw, 4.6em); font-variant-numeric: tabular-nums; }
.ring .num small { display: block; font-family: var(--body); font-size: .2em; color: var(--muted); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; text-align: center; margin-top: -2px; }
.ring .kanji-bg { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(7em, 40vw, 11em); color: var(--a); opacity: .06; pointer-events: none; }
.breath { width: 14px; height: 14px; border-radius: 50%; background: var(--a); margin: 0 auto 10px; animation: breathe 8s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { transform: scale(.7); opacity: .4; } 50% { transform: scale(1.8); opacity: .9; } }
.feel { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
.feel button { position: relative; overflow: hidden; border: 1px solid var(--line2); background: var(--surface); border-radius: 18px; min-height: 110px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-weight: 700; transition: transform .2s var(--ease), background .2s ease; }
.feel button:active { transform: scale(.96); }
.feel button svg { width: 36px; height: 36px; }
.feel button[aria-pressed="true"] { background: var(--a); color: var(--on-a); border-color: transparent; }
.dlist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.dlist li { padding: 12px 14px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; animation: rise .5s var(--ease) both; }
.dlist b { font-size: .95em; } .dlist span.s { grid-column: 1; font-size: .84em; color: var(--muted); } .dlist .fe { grid-row: 1 / span 2; grid-column: 2; font-size: .76em; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--a-soft); color: var(--a); }
.done-hero { text-align: center; padding-top: 10px; position: relative; }
.enso { width: 220px; height: 220px; margin: 0 auto -186px; display: block; position: relative; z-index: 0; }
.enso path { stroke: var(--a); fill: none; stroke-width: 11; stroke-linecap: round; stroke-dasharray: 600; stroke-dashoffset: 600; animation: draw 1.4s .15s var(--ease) forwards; opacity: .75; }
@keyframes draw { to { stroke-dashoffset: 40; } }
.done-hero .portrait { position: relative; z-index: 1; width: 150px; height: 150px; margin: 0 auto 14px; border-radius: 50%; overflow: hidden; box-shadow: var(--shadow2); }
.done-hero .portrait canvas { width: 100%; height: 100%; }
.done-hero .stamp { position: absolute; z-index: 2; left: calc(50% + 50px); top: 118px; width: 60px; height: 60px; font-size: 30px; }
.fx { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
.setstamp { position: fixed; z-index: 70; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none; }
.setstamp .stamp { width: 110px; height: 110px; font-size: 56px; border-radius: 12px; animation: stampin .55s cubic-bezier(.2, 1.6, .4, 1) both, fadeaway .5s 1s ease forwards; }
@keyframes fadeaway { to { opacity: 0; transform: rotate(-8deg) scale(.9); } }

/* ---------- avances ---------- */
.cal { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .h { text-align: center; font-size: .68em; font-weight: 700; color: var(--muted); padding-bottom: 4px; }
.cal .c { aspect-ratio: 1; border-radius: 10px; display: grid; place-items: center; font-size: .8em; font-variant-numeric: tabular-nums; background: var(--surface2); color: var(--muted); position: relative; }
.cal .c.out { background: transparent; }
.cal .c.on { background: transparent; color: var(--ink); font-weight: 700; }
.cal .c.on::before { content: ""; position: absolute; inset: 12%; border-radius: 50%; background: var(--shu); opacity: .9; transform: rotate(-8deg); box-shadow: inset 0 0 0 2px rgba(251, 249, 244, .7); }
.cal .c.on span { position: relative; color: var(--on-shu); }
.cal .c.is-today { box-shadow: inset 0 0 0 1.5px var(--a); color: var(--ink); }
.calnav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.calnav button { position: relative; overflow: hidden; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.calnav button svg { width: 20px; height: 20px; }
.medals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 700px) { .medals { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.medal { padding: 16px 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.medal .m { width: 58px; height: 58px; border-radius: 10px; display: grid; place-items: center; background: transparent; color: var(--muted); border: 1.5px dashed var(--line2); font-family: var(--display); font-size: 26px; transform: rotate(-5deg); }
.medal.got .m { background: var(--shu); color: var(--on-shu); border: 0; box-shadow: inset 0 0 0 2px rgba(251, 249, 244, .75), inset 0 0 0 4px var(--shu); }
.medal b { font-size: .84em; line-height: 1.25; }
.medal span { font-size: .7em; color: var(--muted); line-height: 1.3; }
.chart { width: 100%; max-width: 640px; height: auto; display: block; margin: 0 auto; }
.chart text { fill: var(--muted); font-size: 12px; font-family: var(--body); }
.chart .grid { stroke: var(--line); }
.chart .ln { fill: none; stroke: var(--a); stroke-width: 2; }
.chart .area { fill: var(--a-soft); }
.chart .dot { fill: var(--a); stroke: var(--surface); stroke-width: 2; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: .74em; padding: 6px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -120%); }
.hist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.hist li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); font-size: .9em; }
.hist .dt { font-weight: 700; font-variant-numeric: tabular-nums; }
.hist .fe { font-size: .76em; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--a-soft); color: var(--a); }
.selex { width: 100%; min-height: 50px; border-radius: 10px; border: 1px solid var(--line2); background: var(--surface2); padding: 0 12px; margin-bottom: 12px; }

/* ---------- mi estilo ---------- */
.looks { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.look { position: relative; overflow: hidden; border: 1px solid var(--line); background: var(--surface2); border-radius: 16px; padding: 10px 6px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; font-size: .8em; transition: transform .2s var(--ease), border-color .2s ease, box-shadow .2s ease; }
.look .p { width: 100%; aspect-ratio: 1; border-radius: 50%; overflow: hidden; max-width: 110px; }
.look .p canvas { width: 100%; height: 100%; display: block; }
.look[aria-pressed="true"] { border-color: var(--a); box-shadow: 0 0 0 2px var(--a); }
.look:active { transform: scale(.97); }
.swatches { display: flex; flex-wrap: wrap; gap: 4px 10px; }
.swatch { position: relative; overflow: hidden; width: 74px; border: 0; background: none; padding: 7px 0 2px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .64em; color: var(--muted); font-weight: 700; }
.swatch i { width: 46px; height: 46px; border-radius: 50%; background: var(--c); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); transition: transform .2s var(--ease), box-shadow .2s ease; font-style: normal; color: #fff; font-family: var(--display); font-size: 18px; }
.swatch[aria-pressed="true"] i { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--c); transform: scale(1.05); }
.pats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pat { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); min-height: 74px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 8px 4px; font-size: .68em; font-weight: 700; color: var(--ink2); }
.pat .psw { position: absolute; inset: 0 0 26px 0; background-color: var(--bg); background-size: 30px 15px; border-bottom: 1px solid var(--line); }
.pat[aria-pressed="true"] { border-color: var(--a); box-shadow: 0 0 0 2px var(--a); }
.opts3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opts3 button { position: relative; overflow: hidden; min-height: 48px; border-radius: 12px; border: 1px solid var(--line2); background: var(--surface); font-weight: 700; font-size: .84em; color: var(--ink2); transition: background .2s ease, color .2s ease; }
.opts3 button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.optlabel { font-size: .74em; font-weight: 700; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin: 18px 0 10px; }
.optlabel:first-child { margin-top: 0; }

/* ---------- ajustes / más ---------- */
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.toggle:last-child { border-bottom: 0; }
.toggle b { display: block; } .toggle span { font-size: .8em; color: var(--muted); line-height: 1.45; display: block; }
.sw { width: 58px; height: 34px; border-radius: 99px; border: 0; background: var(--line2); position: relative; flex: none; transition: background .25s ease; }
.sw::after { content: ""; position: absolute; left: 4px; top: 4px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .2); transition: left .25s var(--ease); }
.sw[aria-checked="true"] { background: var(--a); }
.sw[aria-checked="true"]::after { left: 28px; }
.advice { counter-reset: a; list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.advice li { counter-increment: a; display: grid; grid-template-columns: 40px 1fr; gap: 12px; align-items: start; padding: 14px; border-radius: 14px; background: var(--surface2); border: 1px solid var(--line); }
.advice li::before { content: counter(a); width: 34px; height: 34px; border-radius: 8px; background: var(--a-soft); color: var(--a); font-weight: 600; display: grid; place-items: center; font-family: var(--display); }
.advice li.alex { border-left: 3px solid var(--shu); padding-left: 14px; }
.advice li.alex::before { background: var(--shu-soft); color: var(--shu); }
.advice li.warn { background: var(--no-soft); border-color: transparent; }
.advice li.warn::before { background: var(--no); color: #fff; }
.advice small { display: block; color: var(--muted); font-size: .78em; margin-top: 4px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + 26px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-weight: 700; font-size: .86em; opacity: 0; transition: opacity .3s ease, transform .35s var(--ease); z-index: 80; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
/* ventanita de confirmar: absoluta, colocada donde estás mirando (top/height los pone app-views) */
.confirm { position: absolute; left: 0; right: 0; top: 0; height: 100vh; z-index: 90; background: rgba(20, 16, 10, .45); display: grid; place-items: center; padding: 18px; animation: fin .25s ease both; }
.confirm .card { max-width: 420px; width: 100%; padding: 22px; }
.confirm h3 { font-size: 1.3em; margin-bottom: 8px; }
.foot { margin-top: 38px; font-size: .76em; color: var(--muted); text-align: center; line-height: 1.7; }
.foot .jp { display: block; font-size: 1.3em; color: var(--ink2); letter-spacing: .3em; margin-bottom: 4px; }
.fade-in { animation: fin .45s ease both; }
@keyframes fin { from { opacity: 0; } to { opacity: 1; } }
.pop { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.linkbox { margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: var(--a-soft); font-size: .86em; word-break: break-all; user-select: all; -webkit-user-select: all; }
.qr { width: 200px; max-width: 60vw; aspect-ratio: 1; margin: 6px auto 4px; background: #fff; border-radius: 12px; padding: 8px; box-shadow: var(--shadow); }
.qr svg { width: 100%; height: 100%; display: block; }
.stepsN { counter-reset: s; list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
.stepsN li { counter-increment: s; display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; font-size: .92em; }
.stepsN li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--a); color: var(--a); display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: .9em; }
.vpick { padding: 4px 0 14px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
.vpick label { font-size: .78em; font-weight: 700; color: var(--muted); }
.vrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.vrow select { flex: 1 1 180px; min-width: 0; min-height: 48px; border: 1px solid var(--line2); background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
.toggle:has(+ .vpick) { border-bottom: 0; }
.vpick .seg { margin: 0 -4px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.vpick .seg button { min-width: 0; padding-inline: 6px; }

}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .enso path { stroke-dashoffset: 40; } }
/* informe dentro de la guía */

/* ---------- comentarios, «la última vez», abdominales y cardio ---------- */
.lastt { display: flex; gap: 10px; align-items: flex-start; margin: 2px 0 14px; padding: 10px 12px; border-radius: 12px; background: var(--surface2); border: 1px solid var(--line); font-size: .84em; color: var(--ink2); }

.s-links .linkbtn { display: inline-flex; align-items: center; gap: 6px; }

.dict { display: flex; gap: 8px; align-items: flex-start; margin-top: 2px; }
.dict svg { width: 16px; height: 16px; flex: none; margin-top: 3px; color: var(--a); }

.feelnote textarea { min-height: 76px; }
.notesheet textarea { min-height: 120px; }
.hist li .hn, .dlist li .hn { grid-column: 1 / -1; font-size: .92em; font-style: italic; color: var(--ink2); overflow-wrap: anywhere; }
.hist.cms li { grid-template-columns: auto minmax(0, 1fr); }
.hist.cms li > span:last-child:empty { display: none; }
.xgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-top: 16px; }
.xcard h3 { font-size: 1.25em; margin: 6px 0 4px; font-family: var(--display); }
.hiitlist { font-size: .9em; }
.cardio-run { text-align: center; padding: 6px 0; }
.cardio-run .s-title { margin-top: 6px; transition: color .3s ease; min-height: 1.3em; }
.cardio-run[data-k="max"] .s-title { color: var(--shu); }

.cd-next { font-weight: 700; margin-top: 2px; }
.cd-blocks { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 14px auto 0; max-width: 360px; }
.cd-blocks i { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line2); }
.cd-blocks i.d { background: var(--a); border-color: var(--a); }
.cd-blocks i.c { border-color: var(--shu); background: var(--shu); animation: cdpulse .8s ease-in-out infinite alternate; }
@keyframes cdpulse { from { opacity: .45; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .cd-blocks i.c { animation: none; } }
.sv-in { width: 4.2em; border: 0; border-bottom: 2px dashed var(--line2); background: transparent; text-align: center; font-family: var(--display); font-size: 2.1em; font-weight: 600; color: var(--ink); padding: 0; font-variant-numeric: tabular-nums; }
.sv-in:focus { outline: none; border-bottom-color: var(--a); }
.stepper .val b[hidden] { display: none; }
.stepper .val .sv-in { display: block; margin: 0 auto; font-size: 2.3em; line-height: 1.05; }
.sv-in.bump { animation: bump .3s var(--ease); }
/* cuenta atrás antes de cada serie */
.pl-count { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 4px; background: rgba(20, 16, 10, .42); color: #fff; z-index: 3; cursor: pointer; animation: fin .2s ease both; }
.pl-count small { font-weight: 700; letter-spacing: .14em; text-transform: uppercase; font-size: .9em; opacity: .9; }
.pl-count b { font-family: var(--display); font-size: clamp(5em, 30vw, 8em); line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 4px 24px rgba(0, 0, 0, .35); }
.pl-count b.pop { animation: cdpop .5s var(--ease); }
@keyframes cdpop { from { transform: scale(1.35); opacity: .3; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .pl-count b.pop { animation: none; } }

/* ---------- peso (báscula de casa) ---------- */
.pesosec + .weeksec { margin-top: 20px; }
.pesocard { width: 100%; display: flex; align-items: center; gap: 14px; padding: 12px 14px; min-height: 68px; text-align: left; color: var(--ink); font: inherit; cursor: pointer; transition: transform .15s ease, border-color .2s ease; }
.pesocard:active { transform: scale(.985); }

.pesospark { width: 64px; height: 26px; color: var(--a); opacity: .75; flex: none; }

.pesopage { max-width: 420px; }
.pesowheels { position: relative; display: flex; justify-content: center; align-items: center; gap: 4px; height: 220px; margin: 12px 0 6px; user-select: none; -webkit-user-select: none; }
.wheel { position: relative; z-index: 1; height: 220px; width: 92px; overflow-y: auto; scroll-snap-type: y mandatory; overscroll-behavior: contain; scrollbar-width: none; -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent); outline: none; border-radius: 12px; }
.wheel:focus-visible { box-shadow: 0 0 0 2px var(--a); }
.wheel::-webkit-scrollbar { display: none; }
.wheel.dec { width: 58px; }
.wpad { height: 88px; }
.wit { height: 44px; display: grid; place-items: center; font-size: 1.45em; font-weight: 700; color: var(--muted); scroll-snap-align: center; font-variant-numeric: tabular-nums; cursor: pointer; transition: color .15s ease; }
.wit.on { color: var(--ink); font-size: 1.85em; }
.wband { position: absolute; left: 6%; right: 6%; top: 50%; height: 46px; transform: translateY(-50%); border-radius: 12px; background: var(--a-soft); z-index: 0; pointer-events: none; }

.wkg { font-size: 1.15em; color: var(--muted); margin-left: 4px; }
.pesofine { display: flex; align-items: center; justify-content: center; gap: 12px; }

.pdel { width: 40px; height: 40px; border: 1px solid var(--line2); background: var(--surface); border-radius: 10px; display: grid; place-items: center; color: var(--muted); flex: none; cursor: pointer; }

/* ---------- accesibilidad (16-oct): contraste de textos pequeños ---------- */

.tabs button[aria-current="page"] { color: var(--ink); }
.tabs button[aria-current="page"] svg { color: var(--a); }
.chip { color: color-mix(in srgb, var(--a) 60%, var(--ink)); }

/* ---------- velocidad del vídeo: Lenta · Normal · Rápida (16-oct) ---------- */

/* ==========================================================================
   Estilos (temas). Zen es el de siempre; el resto cambia colores, letras,
   formas de tarjetas, botones, sellos y el fondo de la guía entera.
   ========================================================================== */
:root { --on-shu: #FBF9F4; --deco: var(--body); --dw: 600; --stage-bg: #EFEAE1; }
h1, h2, h3 { font-weight: var(--dw); }

.proverb .t.big { font-size: 1.2em; margin-top: 12px; color: var(--ink); }

/* ---------- selector de estilo ---------- */
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.theme-card { position: relative; overflow: hidden; display: flex; gap: 12px; align-items: center; text-align: left; padding: 10px 12px 10px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); color: var(--ink); min-height: 68px; transition: transform .2s var(--ease), border-color .2s ease, box-shadow .2s ease; }
.theme-card:active { transform: scale(.97); }
.theme-card[aria-pressed="true"] { border-color: var(--a); box-shadow: 0 0 0 2px var(--a); }
.theme-card .tc-art { flex: none; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; color: var(--t2); background: var(--t0); background: linear-gradient(145deg, var(--t0), color-mix(in srgb, var(--t0) 70%, var(--t1))); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08), 0 3px 10px rgba(0,0,0,.18); }
.theme-card .tc-emb { width: 30px; height: 30px; }

.theme-card .tc-txt { display: flex; flex-direction: column; min-width: 0; }
.theme-card .tc-name { font-size: 1em; font-weight: 700; line-height: 1.15; }
.theme-card .tc-desc { font-size: .7em; color: var(--muted); line-height: 1.3; margin-top: 3px; }
:root[data-text="3"] .themes { grid-template-columns: minmax(0, 1fr); }
/* destello al cambiar de estilo */
.stylefx { position: fixed; inset: 0; z-index: 90; pointer-events: none; display: grid; place-items: center; animation: sfx 1s ease forwards; opacity: 0; }
.stylefx span { width: 110px; height: 110px; color: #fff; display: grid; place-items: center; animation: sfxin .9s cubic-bezier(.2, 1.4, .4, 1) both; }
.stylefx span svg { width: 100%; height: 100%; filter: drop-shadow(0 4px 18px rgba(0,0,0,.4)); }
.stylefx .tc-k { font-family: "Fz Serif", Georgia, serif; font-size: 90px; color: #fff; }
@keyframes sfx { 0% { opacity: 0; } 25% { opacity: .92; } 100% { opacity: 0; } }
@keyframes sfxin { from { transform: scale(.4) rotate(-20deg); opacity: 0; } 50% { opacity: 1; } to { transform: scale(1.15); opacity: 0; } }

<script>
(function () {
  function start() { try { APP.boot(); } catch (e) { document.getElementById('app').innerHTML = '<div style="padding:30px;font-family:sans-serif">No se pudo iniciar la guía: ' + (e && e.message) + '</div>'; if (window.console) console.error(e); } }
  var done = false;
  function go() { if (done) return; done = true; start(); }
  try {
    if (document.fonts && document.fonts.load) {
      Promise.all([document.fonts.load('600 30px "Fz Serif"'), document.fonts.load('400 30px "Fz Serif"'), document.fonts.load('400 20px "Fz Sans"'), document.fonts.load('500 20px "Fz Sans"'), document.fonts.load('700 20px "Fz Sans"')]).then(go, go);
      setTimeout(go, 1800);
    } else go();
  } catch (e) { go(); }
})();
</script>
<script>
(function () {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  try { if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var icon = window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  var CARD = 'position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:9999;background:#1F1D1A;color:#FBF9F5;border-radius:14px;padding:14px 16px;font:16px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:520px;margin:0 auto';
  var BTN = 'margin:10px 8px 0 0;font:600 16px -apple-system,sans-serif;padding:10px 16px;border-radius:10px;border:0;';
  function put(b) { var go = function () { document.body.appendChild(b); }; if (document.body) go(); else document.addEventListener('DOMContentLoaded', go); }
  // a) Safari del iPhone sin icono: explicar lo del icono (solo se quita para esta visita)
  if (ios && !icon) {
    var h = document.createElement('div'); h.setAttribute('role', 'note'); h.style.cssText = CARD;
    h.innerHTML = '<b>Para que no se pierda nada</b><br>Toca Compartir y elige <b>“Añadir a pantalla de inicio”</b>. Luego ábrela siempre desde ese icono.<br><button type="button" style="' + BTN + 'background:#FBF9F5;color:#1F1D1A">Entendido</button>';
    h.querySelector('button').onclick = function () { h.remove(); };
    put(h); return;
  }
  // b) web vacía: ofrecer recuperar lo copiado en la rutina anterior
  var K = 'fza.v1.sinRecuperar';
  try {
    if (localStorage.getItem(K)) return;
    var raw = localStorage.getItem('fza.v1'), st = raw ? JSON.parse(raw) : null;
    if (st && ((st.sessions || []).length || (st.notes || []).length)) return;
  } catch (e) { return; }
  var r = document.createElement('div'); r.id = 'recuperar'; r.setAttribute('role', 'dialog'); r.style.cssText = CARD;
  r.innerHTML = '<b>¿Tenías entrenos en la rutina de antes?</b><br>Si copiaste tus datos allí, tráelos con un toque.' +
    '<div><button type="button" data-r="si" style="' + BTN + 'background:#FBF9F5;color:#1F1D1A">Recuperar mis datos</button>' +
    '<button type="button" data-r="no" style="' + BTN + 'background:transparent;color:#FBF9F5;border:1px solid rgba(251,249,245,.4)">No</button></div>' +
    '<div data-r="manual" hidden><p style="margin:10px 0 6px">Mantén el dedo en el recuadro, toca <b>Pegar</b> y luego <b>Recuperar</b>.</p>' +
    '<textarea aria-label="Pegar aquí los datos copiados" style="width:100%;box-sizing:border-box;height:70px;border-radius:10px;border:0;padding:8px;font:15px -apple-system,sans-serif"></textarea>' +
    '<button type="button" data-r="pegado" style="' + BTN + 'background:#FBF9F5;color:#1F1D1A">Recuperar</button></div>' +
    '<p data-r="msg" style="margin:8px 0 0;color:#F3C9A8" hidden></p>';
  function msg(t) { var m = r.querySelector('[data-r=msg]'); m.textContent = t; m.hidden = false; }
  function restore(text) {
    text = String(text || ''); var at = text.indexOf('FZA1:');
    if (at < 0) return false;
    var j = text.slice(at + 5); j = j.slice(0, j.lastIndexOf('}') + 1);
    try {
      var o = JSON.parse(j);
      if (!o || o.v !== 1 || !o.sessions || (o.app && o.app !== 'padres')) return false;
      window.APP.replaceState(o);
      try { localStorage.setItem(K, '1'); } catch (e) {}
      r.innerHTML = '<b>Datos recuperados ✓</b>';
      setTimeout(function () { location.reload(); }, 900);
      return true;
    } catch (e) { return false; }
  }
  function manual() { r.querySelector('[data-r=manual]').hidden = false; var t = r.querySelector('textarea'); try { t.focus(); } catch (e) {} }
  r.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-r]'); if (!b) return;
    var k = b.getAttribute('data-r');
    if (k === 'no') { r.remove(); try { localStorage.setItem(K, '1'); } catch (e2) {} }
    if (k === 'si') {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then(function (t) { if (!restore(t)) { msg('No encuentro los datos copiados. Pégalos aquí:'); manual(); } }, manual);
      } else manual();
    }
    if (k === 'pegado') { if (!restore(r.querySelector('textarea').value)) msg('Eso no son los datos de la rutina. Vuelve a copiarlos en la rutina de antes.'); }
  });
  put(r);
})();
</script>
</body></html>
